services:
  mongodb:
    image: mongo:7
    container_name: phoneshopai-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { const status = rs.status(); quit(status.myState === 1 ? 0 : 1); } catch (error) { try { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}); } finally { quit(1); } }",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: phoneshopai-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/techphone_store?replicaSet=rs0
      FRONTEND_URL: http://localhost:3000
      PUBLIC_SITE_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:5000
      DEPLOYMENT_TARGET: docker
      UPLOAD_DIR: /app/uploads
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in your environment or root .env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in your environment or root .env file}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite,gemini-flash-lite-latest}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:-}
      BANK_NAME: ${BANK_NAME:-}
      BANK_BIN: ${BANK_BIN:-}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:-}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_USE_MOCK: "false"
        VITE_SITE_URL: http://localhost:3000
        VITE_DEPLOYMENT_TARGET: docker
    container_name: phoneshopai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  # Optional public tunnel with a fixed ngrok domain so the SePay webhook URL never changes.
  # Enable with COMPOSE_PROFILES=tunnel (or --profile tunnel) plus NGROK_AUTHTOKEN and NGROK_DOMAIN in root .env.
  tunnel:
    image: ngrok/ngrok:3
    container_name: phoneshopai-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["http", "--url=${NGROK_DOMAIN:-}", "backend:5000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
  backend_uploads:
